---
name: Build and deploy

on:
  workflow_dispatch:

  push:
    branches:
      - rdl-1.0
    paths:
      - ".github/workflows/deploy.yml"
      - "_data/**"
      - "_datasets/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "css/**"
      - "img/**"
      - "netlify/**"
      - "python/**"
      - "scripts/**"
      - "_config.yml"
      - "*.html"
      - "netlify.toml"
      - "package-lock.json"
      - "robots.txt"
      - "sitemap.xml"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The GPU binaries are not needed, and their download can fail (404).
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Every attempt has its own name: deploying fails if a run has two
      # artifacts with the same name, as after running it again.
      artifact-name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        working-directory: ./python
        run: |
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_CONSTRAINT=/tmp/constraint.txt python3 -m pip install Cython
          PIP_CONSTRAINT=/tmp/constraint.txt python3 -m pip install -r requirements.txt

      - name: Restore generated vectors
        id: vector-cache
        uses: actions/cache@v4
        with:
          path: |
            python/vectors.bin
            python/vectors.ids.json
          key: vectors-ubuntu-py3.13-${{ hashFiles('_datasets/json/**/*.json', 'python/generate_vectors.py', 'python/pack_vectors.py', 'python/mappers.py', 'python/config.py', 'python/utils.py', 'python/requirements.txt') }}

      - name: Generate vector embeddings
        if: steps.vector-cache.outputs.cache-hit != 'true'
        working-directory: ./python
        run: python3 generate_vectors.py

      - name: Pack vectors for the query function
        if: steps.vector-cache.outputs.cache-hit != 'true'
        working-directory: ./python
        run: python3 pack_vectors.py

      - name: Build sqlite.db and search.db
        working-directory: ./python
        run: python3 import.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write the first datasets of the home page
        run: node scripts/initial-data.mjs

      - name: Upload search data to Netlify Blobs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: node scripts/netlify-data.mjs upload

      # Pushes do not deploy the function by themselves, and the site needs the
      # version that matches its pages and data.
      - name: Deploy the query function to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@27.20.1 deploy --prod --no-build
          --dir public --functions netlify/functions
          --message "GitHub ${{ github.sha }}"

      - name: Check the query function
        run: node scripts/check-query-function.mjs

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Write metadata to a file Jekyll can use
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "branch: $BRANCH" > _config.ci.yml

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --config _config.ci.yml,_config.yml
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}

  # A job of its own, so that running only the failed jobs again does not build
  # the site again.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      # The artifact may not be listed right after its upload, and deploying
      # does not wait for it.
      - name: Wait for the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME"
          for attempt in $(seq 30); do
            count=$(gh api "$url" --jq .total_count || echo 0)
            if [ "$count" = 1 ]; then
              exit 0
            fi
            echo "Attempt $attempt: $count artifacts"
            sleep 5
          done
          echo "::error::The artifact $ARTIFACT_NAME is not listed."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
