---
name: Build and upload search data

on:
  workflow_dispatch:

  push:
    branches:
      - rdl-1.0
      - "rdl-0.**"
    paths:
      - "_datasets/**"
      - "python/**"

permissions:
  contents: read

concurrency:
  group: build-and-upload-search-data
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./python
        run: |
          echo 'Cython < 3.0' > /tmp/constraint.txt && PIP_CONSTRAINT=/tmp/constraint.txt pip install 'PyYAML==6.0.0'
          python3 -m pip install -r requirements.txt

      - name: Generate vector embeddings
        working-directory: ./python
        run: python3 generate_vectors.py

      - name: Pack vectors for the query function
        working-directory: ./python
        run: python3 pack_vectors.py

      - name: Build sqlite.db
        working-directory: ./python
        run: python3 import.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload search data to Netlify Blobs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: node scripts/netlify-data.mjs upload