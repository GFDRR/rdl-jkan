---
name: Generate markdown, vector embeddings, and test artefacts on PR open/synchronize

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - rdl-0.**

permissions:
  contents: write
  pull-requests: write

jobs:
  markdown:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUMBER: ${{ github.event.number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: python3 -m venv .venv
      - run: source .venv/bin/activate
      - run: echo 'Cython < 3.0' > /tmp/constraint.txt && PIP_CONSTRAINT=/tmp/constraint.txt pip install 'PyYAML==6.0.0'
      - run: python3 -m pip install -r requirements.txt
      
      - name: Generate markdown from new JSON metadata
        run: python3 main.py --ci --markdown --vectors --test search
        continue-on-error: true  # Don't block PR on test failures
      
      - name: Set up git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      - name: Commit markdown files
        run: |
          git add ../_datasets
          git diff-index --quiet HEAD || git commit -m "Generate markdown from new JSON metadata"
          git push
          echo "Complete"
      
      - name: Commit vector embeddings
        run: |
          git add ./vectors.json
          git diff-index --quiet HEAD || git commit -m "Generate vector embeddings"
          git push
          echo "Complete"
