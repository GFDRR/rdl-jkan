title: Risk Data Library catalog (beta)
greeting: Risk Data Library catalog
description: A simple catalog to find datasets compliant with the Risk Data Library
# Must match site_url in python/config.py
url: https://catalog.riskdatalibrary.org
baseurl: 
logo: https://www.gfdrr.org/themes/custom/gfdrr/images/GFDRR_Primary%20Logo_BW-Shade.svg

netlify_api_base: "https://rdl-jkan.netlify.app"

# Site theme
# jkan_theme: Default
jkan_theme: RDL-flatly

# Authentication
github_client_id: e70f0123742062ebd1cc
gatekeeper_host: https://rdl-jkan.herokuapp.com

# Dataset schema
schema: rdls-10

# RDLS Metadata Editor. edit_param is the query parameter that opens a catalogue
# dataset in the editor; dataset pages link to it with "Open in Editor". Empty
# hides the link.
metadata_editor:
  url: https://docs.riskdatalibrary.org/en/latest/_static/RDL_MDE.html
  edit_param: "dataset"

# Nav bar
navigation:
  - title: RDL Project
    url: http://riskdatalibrary.org/

# Collections
collections:
  datasets:
    output: true
    permalink: /datasets/:title/
  sources:
    output: true
    permalink: /sources/:path/

# Collections (cont'd)
defaults:
  - scope:
      path: ""
      type: datasets
    values:
      layout: dataset
      category: Uncategorized
  - scope:
      path: ""
      type: sources
    values:
      layout: sources

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM

# Google tag (analytics). Only in production builds; empty turns it off.
google_analytics:
  tag_id: "GTM-5SWVC57C"

# Ownership of the site in Google Search Console. Empty turns it off.
google_site_verification: "6wU_N0VweNfQmD7DG1nm7KjWu07NpwgHxIvyEGcKERA"

# US Digital Analytics Program - https://analytics.usa.gov
digital_analytics_program:
  enabled: false
  agency: ""
  subagency: ""

# Hypothesis.io - Annotator
hypothesis:
  enabled: false

# Twitter
twittercard:
  enabled: false
  username: "@"

# Open Graph
opengraph:
  enabled: true

# Exclude these files from the build
# The dataset JSON is read by datasets.json and python/import.py. Left in, Jekyll
# would write every file over /datasets.json, the collection's shared permalink.
exclude:
  - _datasets/json
  - Gemfile
  - Gemfile.lock
  - vendor
  - .travis.yml
  - node_modules
  - scripts/src
  - scripts/dev
  - netlify
  - netlify.toml
  - python
  - package.json
  - webpack.config.js
  - README.md
  - LICENSE
  - search.db
  - search.db-journal
  - sqlite.db
  - sqlite.db-journal

plugins:
  - jekyll-gzip
  - jekyll_sqlite

gzip:
  extensions:
    - '.json'
    - '.jsonld'

sqlite:
  - collection: datasets
    file: sqlite.db
    query: >-
      SELECT datasets.*, dataset_jsonld.schema_org,
        '/datasets/' || datasets.slug || '/' AS permalink
      FROM datasets
        LEFT JOIN dataset_jsonld ON dataset_jsonld.dataset_id = datasets.id
