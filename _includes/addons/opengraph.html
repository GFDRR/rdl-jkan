<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}" />
<meta property="og:site_name" content="{{ site.title }}" />
{% assign description = page.description | default: site.description %}
<meta property="og:description" content="{{ description | strip_newlines | truncate: 200 | escape }}" />
<meta name="og:image" content="{{ site.baseurl }}{{ site.logo }}" />
<meta name="og:image:width" content="150" />
<meta name="og:image:height" content="150" />
