---
title: Datasets
layout: default
---

{% include breadcrumbs.html %}

<div class="row">
  <div
    x-data="{
        query: '',
        showCategories: 5,
        showCountries: 5,
        showScales: 5,
        showHazards: 5,
        showLicenses: 5,
        showProjects: 5,
        
        // Partition function (from lodash)
        partition(array, predicate) {
          return array.reduce((acc, item) => {
            acc[predicate(item) ? 0 : 1].push(item);
            return acc;
          }, [[], []]);
        },
        
        // Keyword search function
        keywordSearch(datasets) {
          const keys = ['title', 'notes', 'description', 'license'];
          const lowerCaseQuery = this.query.toLowerCase();
          return this.partition(datasets, function (dataset) {
            return keys.reduce(function (previousValue, key) {
              return (
                previousValue ||
                (dataset[key] &&
                  dataset[key].toLowerCase().indexOf(lowerCaseQuery) !== -1)
              );
            }, false);
          });
        },
        
        // Get filtered datasets (keyword search + filters)
        get filteredDatasets() {
          if (!$store.datasets.unfiltered.length) return { matches: [], others: [] };
          
          // First apply keyword search if query exists
          let datasetsToFilter = $store.datasets.unfiltered;
          if (this.query.trim()) {
            const [matches, others] = this.keywordSearch(datasetsToFilter);
            datasetsToFilter = matches;
          }
          
          // Then apply filters
          const filtered = $store.datasets.applyFilters(datasetsToFilter);
          
          // Return in same format as before
          if (this.query.trim()) {
            return { matches: filtered, others: [] };
          }
          return { matches: filtered, others: [] };
        },
        
        // Get datasets for filter options (faceted search)
        // Applies keyword search + all filters EXCEPT the specified filter type
        getDatasetsForFilterOptions(excludeFilterType) {
          if (!$store.datasets.unfiltered.length) return [];
          
          // Start with all datasets
          let datasets = $store.datasets.unfiltered;
          
          // Apply keyword search if query exists
          if (this.query.trim()) {
            const [matches] = this.keywordSearch(datasets);
            datasets = matches;
          }
          
          // Apply all filters except the excluded one
          return $store.datasets.applyFiltersExcluding(datasets, excludeFilterType);
        },
        
        // Check if any filters are active
        get hasActiveFilters() {
          return $store.datasets.activeFilterCount > 0;
        }
    }"
  >
    <div class="col-sm-4">
      <!-- Active Filters Summary -->
      <div x-show="hasActiveFilters" style="margin: 10px 0">
        <span
          x-text="$store.datasets.activeFilterCount + ' filter(s) active'"
        ></span>
        <button
          @click="$store.datasets.clearFilters()"
          class="btn btn-xs btn-default"
        >
          Clear all
        </button>
      </div>

      <!-- Categories Filter -->
      <div style="margin: 15px 0">
        <h4>Categories</h4>
        <div class="list-group">
          <template
            x-for="item in $store.datasets.getFilterOptions('category', getDatasetsForFilterOptions('category')).slice(0, showCategories)"
            :key="item.slug"
          >
            <a
              href="#"
              class="list-group-item"
              :class="{ 'active': item.selected }"
              @click.prevent="$store.datasets.toggleFilter('category', item.slug)"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <span
                class="list-group-item-truncate"
                x-text="item.title"
                style="
                  flex: 1;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                "
              ></span>
              <span class="badge" x-text="item.count"></span>
              <span x-show="item.selected" class="badge"
                ><i class="fa fa-times"></i
              ></span>
            </a>
          </template>
          <a
            href="#"
            class="list-group-item"
            x-show="$store.datasets.getFilterOptions('category', getDatasetsForFilterOptions('category')).length > showCategories"
            @click.prevent="showCategories = showCategories + 10"
          >
            Show more...
          </a>
        </div>
      </div>

        placeholder="Search..."

        x-text="`${filteredDatasets.matches.length} dataset${filteredDatasets.matches.length === 1 ? '' : 's'} matching query`"
      ></h3>

      <ul>
        <template
          x-for="data in filteredDatasets.matches"
          :key="data.dataset_id"
        >
          <rdl-dataset>
            <h3><a x-bind:href="data.url" x-text="data.title"></a></h3>
            <span x-text="data.description || ''"></span>
            <br /><br />
            <strong>Developed by (version):</strong
            ><span
              x-text="` ${data.creator?.name || 'Unknown'}  (${data.version || 'Version not supplied'})`"
            ></span>
            <br />
            <strong>Geo Coverage:</strong
            ><span
              x-text="` ${Array.isArray(data.geo_coverage) ? data.geo_coverage.join(', ') : data.geo_coverage || 'Not supplied'}`"
            ></span>
            <br />
            <strong>License:</strong>
            <span x-show="data.license_display == null">
              Unknown or not provided</span
            >
            <span x-show="data.license != null && data.license != 'Not found'">
              <a
                property="dct:license"
                x-bind:resource="data.license_display"
                x-bind:href="data.license"
                x-text="data.license_display"
              ></a>
            </span>
            <span
              x-show="data.license_display != null && (data.license == null || data.license == 'Not found')"
              x-text="data.license_display"
            ></span>
            <hr />
          </rdl-dataset>

      </ul>
