---
layout: default
---

<div
  class="content-wrapper"
  x-data
  x-init="window.__sqlReady.then(db => $store.dataset.loadDataset(db, '{{ page.slug }}')).catch(err => console.error('Error loading database:', err))"
>
  <div class="modern-content">
    <template x-if="$store.dataset.dataset">
      <div >
        <div
          class="dataset-detail-layout"
          data-hook="view"
          data-view="display"
          typeof="dcat:Dataset"
          :resource="$store.dataset.dataset.url"
        >
          <main class="main-content">
            <div class="dataset-header">
              <div
                :class="'category-badge ' + $store.dataset.dataset.risk_data_type[0]"
              >
                <span class="badge-icon"></span>
                <p
                  x-text="$store.dataset.dataset.risk_data_type[0]"
                ></p>
              </div>
              <h1 class="dataset-title">
                <span property="dct:title">{{ page.title }}</span>
              </h1>
              <div
                x-data="{ open: false }"
                x-bind:class="'dataset-description desc-truncate' + (open ? ' expanded' : '')"
                property="dct:description"
              >
                <p x-ref="description" class="desc-text" x-text="$store.dataset.dataset.description">
                </p>
                <button
                  x-show="$refs.description.scrollHeight > $refs.description.clientHeight"
                  class="desc-toggle"
                  @click="open = ! open"
                  x-text="open ? 'Show less' : 'Show more'"
                ></button>
              </div>

              <div class="quick-info">
                <div
                  class="info-card"
                  x-show="$store.dataset.dataset.creator.name"
                >
                  <div class="info-label">Organization</div>
                  <div
                    class="info-value"
                    x-text="$store.dataset.dataset.creator.name"
                  ></div>
                </div>
                <div class="info-card" x-show="$store.dataset.dataset.version">
                  <div class="info-label">Version</div>
                  <div
                    class="info-value"
                    x-text="$store.dataset.dataset.version"
                  ></div>
                </div>
                <div class="info-card">
                  <div class="info-label">License</div>
                  <div
                    class="info-value"
                    x-text="$store.dataset.dataset.license_title"
                  ></div>
                </div>
              </div>
            </div>

            <div class="content-section">
              <h2 class="section-title">Resources</h2>
              <ul class="resources-list">
                <template
                  x-for="resource in $store.dataset.dataset.resources"
                  :key="resource.id"
                >
                  <li
                    class="resource-item"
                    data-hook="resource-item"
                    property="dcat:distribution"
                    typeof="dcat:Distribution"
                  >
                    <div class="resource-header">
                      <h3 class="resource-title">
                        <a
                          href="resource.download_url"
                          property="dcat:accessURL"
                        >
                          <i class="fa fa-download"></i>
                          <span
                            property="dct:title"
                            x-text="resource.title"
                          ></span>
                        </a>
                      </h3>
                      <span
                        x-show="resource.format"
                        class="format-badge"
                        property="dcat:mediaType"
                        x-text="resource.format"
                      ></span>
                      <span
                        x-show="!resource.format && resource.media_type"
                        class="format-badge"
                        property="dcat:mediaType"
                        x-text="resource.media_type"
                      ></span>
                    </div>
                    <p
                      x-show="resource.description"
                      class="resource-description"
                      x-text="resource.description"
                    ></p>
                  </li>
                </template>
              </ul>
            </div>
            <div class="content-section">
              <h2 class="section-title">Dataset Info</h2>
              <table class="data-table">
                <tr>
                  <th>ID of dataset</th>
                  <td x-text="$store.dataset.dataset.id"></td>
                </tr>
                <tr>
                  <th>Catalog</th>
                  <td x-text="$store.dataset.dataset.catalog_title"></td>
                </tr>
                <tr x-show="$store.dataset.dataset.publisher.name">
                  <th>Publisher of dataset</th>
                  <td x-show="$store.dataset.dataset.publisher.url">
                    <a
                      :href="$store.dataset.dataset.publisher.url"
                      x-text="$store.dataset.dataset.publisher.name"
                    ></a>
                  </td>
                  <td
                    x-show="!$store.dataset.dataset.publisher.url"
                    x-text="$store.dataset.dataset.publisher.name"
                  ></td>
                </tr>
                <tr x-show="$store.dataset.dataset.details">
                  <th>Additional details</th>
                  <td x-text="$store.dataset.dataset.details"></td>
                </tr>
                <tr x-show="$store.dataset.dataset.creator.name">
                  <th>Creator</th>
                  <td x-show="$store.dataset.dataset.creator.url">
                    <a
                      :href="$store.dataset.dataset.creator.url"
                      x-text="$store.dataset.dataset.creator.name"
                    ></a>
                  </td>
                  <td
                    x-show="!$store.dataset.dataset.creator.url"
                    x-text="$store.dataset.dataset.creator.name"
                  ></td>
                </tr>
                <tr
                  x-show="$store.dataset.dataset.contact_point.name"
                >
                  <th>Contact Point</th>
                  <td
                    x-show="$store.dataset.dataset.contact_point.url"
                  >
                    <a
                      :href="$store.dataset.dataset.contact_point.url"
                      x-text="$store.dataset.dataset.publisher.name"
                    ></a>
                  </td>
                  <td
                    x-show="!$store.dataset.dataset.contact_point.url"
                    x-text="$store.dataset.dataset.contact_point.name"
                  ></td>
                </tr>
                <tr>
                  <th>License</th>
                  <td>
                    <a
                      :href="$store.dataset.dataset.license_url"
                      x-text="$store.dataset.dataset.license_title"
                    ></a>
                  </td>
                </tr>
              </table>
            </div>
            <template x-for="rdt in $store.dataset.dataset.risk_data_type" :key="rdt">
              <div>
                <template x-if="rdt === 'exposure'">
                  <div class="content-section risk-component-section exposure">
                    <h2 class="section-title">
                      <span class="component-icon exposure"></span>
                      Exposure Component
                    </h2>
                    <table class="data-table rdl-table" >
                      <template x-for="exposure in $store.dataset.dataset.exposure" :key="exposure.id">
                        <tbody>
                          <tr>
                            <th>Exposure</th>
                            <th>Category</th>
                            <th></th>
                            <th></th>
                          </tr>
                          <tr>
                            <td x-text="exposure.id"></td>
                            <td x-text="exposure.category"></td>
                            <td></td>
                            <td></td>
                          </tr>
                          <tr>
                            <th></th>
                            <th>Metric</th>
                            <th>Dimension</th>
                            <th>Unit</th>
                          </tr>
                          <template x-for="metric in exposure.metrics" :key="metric.id">
                            <tr>
                              <td></td>
                              <td x-text="metric.id"></td>
                              <td x-text="metric.dimension"></td>
                              <td x-text="metric.measurement.unit"></td>
                            </tr>
                          </template>
                        </tbody>
                      </template>
                    </table>
                  </div>
                </template>
                <template x-if="rdt === 'hazard'">
                  <div class="content-section risk-component-section hazard">
                    <h2 class="section-title">
                      <span class="component-icon hazard"></span>
                      Hazard Component
                    </h2>
                    <table class="data-table rdl-table" >
                      <template x-for="event_set in $store.dataset.dataset.hazard.event_sets" :key="event_set.id">
                        <tbody>
                          <tr>
                            <th>Event Set</th>
                            <th>Analysis Type</th>
                            <th>Calculation Method</th>
                            <th></th>
                            <th></th>
                            <th></th>
                          </tr>
                          <tr>
                            <td x-text="event_set.id"></td>
                            <td x-text="event_set.analysis_type"></td>
                            <td x-text="event_set.calculation_method"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                          </tr>
                          <tr>
                            <th></th>
                            <th>Event</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Hazard Type</th>
                            <th>Hazard Process</th>
                          </tr>
                          <template x-for="event in event_set.events" :key="event.id">
                              <tr>
                                <td></td>
                                <td x-text="event.id"></td>
                                <td x-text="event.occurrence[event_set.analysis_type].temporal.start"></td>
                                <td x-text="event.occurrence[event_set.analysis_type].temporal.end"></td>
                                <td x-text="event.hazard.type"></td>
                                <td x-text="event.hazard.process"></td>
                              </tr>
                            </template>
                        </tbody>
                      </template>
                    </table>
                  </div>
                </template>
                <template x-if="rdt === 'loss'">
                  <div class="content-section risk-component-section loss">
                    <h2 class="section-title">
                      <span class="component-icon loss"></span>
                      Loss Component
                    </h2>
                    <table class="data-table rdl-table" >
                      <tr>
                        <th>Loss</th>
                        <th>Loss Type</th>
                        <th>Impact Unit</th>
                      </tr>
                      <template x-for="loss in $store.dataset.dataset.loss.losses" :key="loss.id">
                        <tr>
                          <td x-text="loss.id"></td>
                          <td x-text="loss.impact_and_losses.loss_type"></td>
                          <td x-text="loss.impact_and_losses.impact.measurement.unit"></td>
                        </tr>
                      </template>
                    </table>
                  </div>
                </template>
                <template x-if="rdt === 'vulnerability'">
                  <div class="content-section risk-component-section vulnerability">
                    <h2 class="section-title">
                      <span class="component-icon vulnerability"></span>
                      Vulnerability Component
                    </h2>
                    <table class="data-table rdl-table" >
                      <tr>
                        <th>Vulnerability Function</th>
                        <th>Category</th>
                        <th>Analysis Type</th>
                        <th>Approach</th>
                      </tr>
                      <template x-for="vuln_function in $store.dataset.dataset.vulnerability.functions.vulnerability" :key="vuln_function.id">
                        <tr>
                          <td x-text="vuln_function.id"></td>
                          <td x-text="vuln_function.category"></td>
                          <td x-text="vuln_function.hazard_analysis_type"></td>
                          <td x-text="vuln_function.approach"></td>
                        </tr>
                      </template>
                    </table>
                  </div>
                </template>
              </div>
            </template>
          </main>

          <aside class="sidebar">
            <div class="sidebar-card">
              <h4>Metadata</h4>
              <div style="display: flex; gap: 8px; margin-top: 12px">
                <a
                  href="https://raw.githubusercontent.com/GFDRR/rdl-jkan/rdl-1.0/_datasets/json/{{ page.id }}.json"
                  class="format-badge"
                  style="text-decoration: none"
                  property="dcat:accessURL"
                  download
                >
                  json
                </a>
              </div>
            </div>
            <div
              x-show="$store.dataset.dataset.spatial.countries"
              class="sidebar-card"
            >
              <h4>Spatial Extent</h4>
              <div
                id="spatial-extent-map"
                style="
                  height: 160px;
                  border-radius: 8px;
                  overflow: hidden;
                  border: 1px solid #e5e7eb;
                  background: #e5e7eb;
                "
              ></div>
            </div>
            <script>
              const map = L.map('spatial-extent-map', {
                zoomControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false,
                tap: false,
                touchZoom: false,
                attributionControl: true
              });
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> and <a href="https://www.geoboundaries.org/">GeoBoundaries</a>'
              }).addTo(map);
              const spatial = window.Alpine.store('dataset').dataset.spatial ?? {};
              const countryCodes = spatial.countries.map(c =>c.slug) || [];
              const bbox = spatial.bbox || null;
              const isGlobal = (spatial.scale || "").toLowerCase() === "global";
              if (isGlobal) {
                map.setView([20, 0], 1);
              } else {
                const featureGroup = L.featureGroup().addTo(map);
                if (bbox) {
                  const [ minLon, minLat, maxLon, maxLat] = bbox;
                  const bounds = L.latLngBounds([[minLat, minLon], [maxLat, maxLon]]);
                  featureGroup.addLayer(L.rectangle(bounds));
                  map.fitBounds(featureGroup.getBounds());
                }
                else if (countryCodes.length > 0) {
                  Promise.all(countryCodes.map(countryCode =>
                    fetch(`/country_geojson/${countryCode}.geojson`)
                      .then(response => response.json())
                      .then(data => {
                        L.geoJSON(data).addTo(featureGroup);
                      })
                      .catch(error => console.error('Error loading GeoJSON:', error))
                  )).then(() => {
                    if (featureGroup.getLayers().length > 0) {
                      map.fitBounds(featureGroup.getBounds());
                    }
                  });
                }
              }
            </script>
          </aside>
        </div>
      </div>
    </template>
  </div>
</div>
