---
layout: default
---

<div
  class="content-wrapper ds-page"
  x-data
  x-init="$store.dataset.loadDataset('{{ page.slug }}')"
>
  <div x-show="$store.dataset.isLoading" class="datasets-loading">
    <div
      class="loading-spinner"
      role="status"
      aria-label="Loading dataset…"
    ></div>
    <p>Loading dataset…</p>
  </div>
  <div x-cloak x-show="$store.dataset.loadError" class="datasets-error">
    <p>Couldn't load this dataset. Please try again.</p>
    <button @click="window.location.reload()" class="btn btn-default">
      Try again
    </button>
  </div>
  <template x-if="$store.dataset.dataset">
    <div
      data-hook="view"
      data-view="display"
      typeof="dcat:Dataset"
      :resource="$store.dataset.dataset.url"
    >
      <header class="ds-overview">
        <div>
          <div class="category-badges">
            <template
              x-for="rdt in $store.dataset.dataset.risk_data_type"
              :key="rdt"
            >
              <div class="category-badge" :class="rdt">
                <span class="badge-icon"></span>
                <p x-text="rdt"></p>
              </div>
            </template>
          </div>
          <h1 class="ds-title">
            <span property="dct:title">{{ page.title }}</span>
          </h1>
          <div
            x-data="{ open: false }"
            class="ds-description desc-truncate"
            :class="{ expanded: open }"
            property="dct:description"
          >
            <p x-ref="description" class="desc-text" x-text="$store.dataset.dataset.description"></p>
            <button
              type="button"
              x-show="$refs.description.scrollHeight > $refs.description.clientHeight"
              class="desc-toggle"
              @click="open = ! open"
              x-text="open ? 'Show less' : 'Show more'"
            ></button>
          </div>
          <dl class="ds-facts">
            <template x-for="fact in $store.dataset.page.facts" :key="fact.name">
              <div>
                <dt x-text="fact.name"></dt>
                <dd x-text="fact.value"></dd>
              </div>
            </template>
          </dl>
        </div>

        <aside class="ds-aside">
          <div
            id="spatial-extent-map"
            class="ds-map"
            role="img"
            aria-label="Spatial extent"
            x-init="$nextTick(() => $store.dataset.drawMap($el, '{{ site.baseurl }}'))"
          ></div>
          <p class="ds-places" x-show="$store.dataset.page.countries.length > 1">
            <span x-text="$store.dataset.countries"></span>
            <button
              type="button"
              class="desc-toggle"
              x-show="$store.dataset.moreCountries"
              @click="$store.dataset.allCountries = true"
              x-text="'and ' + $store.dataset.moreCountries + ' more'"
            ></button>
          </p>
          <div class="ds-actions">
            <a class="ds-btn primary" href="#files">
              Get the data
              <span
                x-text="'(' + $store.dataset.page.files.total + ($store.dataset.page.files.total === 1 ? ' file)' : ' files)')"
              ></span>
            </a>
            <div class="ds-pair">
              {% if site.metadata_editor.edit_param and site.metadata_editor.edit_param != "" %}
              <a
                class="ds-btn"
                href="{{ site.metadata_editor.url }}?{{ site.metadata_editor.edit_param }}={{ page.slug | url_encode }}"
                target="_blank"
                rel="noopener"
                >Open in Editor</a
              >
              {% endif %}
              <a
                class="ds-btn"
                href="https://raw.githubusercontent.com/GFDRR/rdl-jkan/rdl-1.0/_datasets/json/{{ page.slug }}.json"
                download
                >MetaData (JSON)</a
              >
            </div>
          </div>
        </aside>
      </header>

      <nav
        class="ds-index"
        aria-label="Sections of the dataset"
        x-data="sectionIndex"
        @scroll.window.throttle.50ms="mark()"
      >
        <div class="ds-index-links">
          <template x-for="section in $store.dataset.sections" :key="section.id">
            <a
              :href="'#' + section.id"
              :class="section.kind"
              :aria-current="current === section.id ? 'true' : 'false'"
            >
              <span x-text="section.title"></span>
              <span class="ds-count" x-show="section.count" x-text="section.count.toLocaleString('en')"></span>
            </a>
          </template>
        </div>
      </nav>

      <main class="ds-sections">
        <template x-for="section in $store.dataset.sections" :key="section.id">
          <section class="ds-section" :class="section.kind" :id="section.id">
            <div class="ds-section-head">
              <h2 x-text="section.title"></h2>
              <p x-text="section.summary"></p>
            </div>

            <p
              class="ds-empty"
              x-show="section.kind !== 'neutral' && !section.count"
            >The metadata gives no details for this component.</p>

            <template x-if="section.id === 'hazard' && section.count">
              <div x-data="{ sets: $store.dataset.page.hazard, open: 0 }">
                <div class="ds-tabs" role="group" aria-label="Event sets" x-show="sets.length > 1">
                  <template x-for="set in sets" :key="set.key">
                    <button
                      type="button"
                      class="ds-tab"
                      :aria-pressed="open === set.key"
                      @click="open = set.key"
                    >
                      <span x-text="set.title"></span>
                      <span class="ds-count" x-show="set.count" x-text="set.count"></span>
                    </button>
                  </template>
                </div>
                <template x-for="set in sets.filter((set) => set.key === open)" :key="set.key">
                  <div class="ds-blocks">
                    {% include dataset/params.html list="set.params" %}
                    <template x-if="set.hazards">
                      <div class="ds-block">
                        <h3>Hazards <span class="ds-count" x-text="set.hazards.total"></span></h3>
                        <div x-data="datasetTable(set.hazards)">{% include dataset/table.html %}</div>
                      </div>
                    </template>
                    <template x-if="set.events">
                      <div class="ds-block">
                        <h3>Events <span class="ds-count" x-text="set.events.total.toLocaleString('en')"></span></h3>
                        <div x-data="datasetTable(set.events)">{% include dataset/table.html %}</div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="section.id === 'exposure' && section.count">
              <div class="ds-assets">
                <template x-for="asset in $store.dataset.page.exposure" :key="asset.key">
                  <div class="ds-asset" :class="{ wide: asset.grouped }">
                    <div>
                      <h3>
                        <span x-text="asset.title"></span>
                        <span class="ds-tag" x-show="asset.category" x-text="asset.category"></span>
                        <span class="ds-count" x-show="asset.grouped" x-text="asset.count + ' metrics'"></span>
                      </h3>
                      <p x-show="asset.description" x-text="asset.description"></p>
                      <p x-show="asset.assetType" x-text="'Asset type ' + asset.assetType"></p>
                    </div>
                    <div>
                      <template x-for="group in asset.groups" :key="group.name">
                        <div>
                          <h4 class="ds-dimension" x-show="group.name">
                            <span x-text="group.name"></span>
                            <span class="ds-count" x-text="group.metrics.length"></span>
                          </h4>
                          <ul class="ds-metrics">
                            <template x-for="(metric, index) in group.metrics" :key="index">
                              <li>
                                <span class="ds-quantity" :class="metric.quantity" x-text="metric.quantityLabel"></span>
                                <span>
                                  <span x-text="metric.name"></span>
                                  <span class="ds-muted" x-text="metric.details"></span>
                                </span>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="section.id === 'vulnerability' && section.count">
              <div class="ds-blocks" x-data="{ vulnerability: $store.dataset.page.vulnerability }">
                <div class="ds-block" x-show="vulnerability.functions.length">
                  <h3>Functions <span class="ds-count" x-text="vulnerability.functions.length"></span></h3>
                  <template x-for="fn in vulnerability.functions" :key="fn.key">
                    <details class="ds-function" :open="fn.open">
                      <summary>
                        <span>
                          <b x-text="fn.title"></b>
                          <span class="ds-muted" x-text="fn.type"></span>
                        </span>
                        <span x-text="fn.category"></span>
                        <span class="ds-muted" x-text="fn.hazard"></span>
                      </summary>
                      <div class="ds-function-body">
                        <p x-show="fn.details" x-text="fn.details"></p>
                        {% include dataset/params.html list="fn.params" %}
                        <span class="ds-note" x-text="fn.id"></span>
                      </div>
                    </details>
                  </template>
                </div>
                <template x-if="vulnerability.indices">
                  <div class="ds-block">
                    <h3>Socio-economic indices <span class="ds-count" x-text="vulnerability.indices.total"></span></h3>
                    <div x-data="datasetTable(vulnerability.indices)">{% include dataset/table.html %}</div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="section.id === 'loss' && section.count">
              <div
                x-data="datasetTable($store.dataset.page.loss.table)"
              >
                <template x-if="$store.dataset.page.loss.matrix">
                  <div x-data="{ matrix: $store.dataset.page.loss.matrix }">
                    <p class="ds-lead">
                      What the dataset measures for each hazard and asset, with
                      the unit. These are the kinds of loss described in the
                      metadata; the loss amounts are in the files. Select one
                      to see its entries.
                    </p>
                    <div class="ds-scroll">
                      <table class="ds-matrix">
                        <thead>
                          <tr>
                            <th scope="col">Hazard</th>
                            <template x-for="asset in matrix.assets" :key="asset">
                              <th scope="col" x-text="asset"></th>
                            </template>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="row in matrix.rows" :key="row.hazard">
                            <tr>
                              <th scope="row" x-text="row.hazard"></th>
                              <template x-for="cell in row.cells" :key="cell.asset">
                                <td>
                                  <template x-for="item in cell.measures" :key="item.measure">
                                    <button
                                      type="button"
                                      class="ds-quantity"
                                      :class="item.quantity"
                                      :aria-pressed="isOn({ hazard: row.hazard, asset: cell.asset, measure: item.measure })"
                                      @click="toggle({ hazard: row.hazard, asset: cell.asset, measure: item.measure })"
                                      x-text="item.measure"
                                    ></button>
                                  </template>
                                  <span class="ds-muted" x-show="!cell.measures.length">Not covered</span>
                                </td>
                              </template>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <h3 class="ds-table-title">
                      Loss entries <span class="ds-count" x-text="table.total"></span>
                    </h3>
                  </div>
                </template>
                {% include dataset/table.html %}
              </div>
            </template>

            <template x-if="section.id === 'files' && section.count">
              <div x-data="datasetTable($store.dataset.page.files)">
                {% include dataset/table.html distribution=true %}
              </div>
            </template>

            <template x-if="section.id === 'sources'">
              <div class="ds-blocks" x-data="{ sources: $store.dataset.page.sources }">
                <p class="ds-text" x-show="sources.description" x-text="sources.description"></p>
                <template x-if="sources.sources">
                  <div class="ds-block">
                    <h3>Sources <span class="ds-count" x-text="sources.sources.total"></span></h3>
                    <div x-data="datasetTable(sources.sources)">{% include dataset/table.html %}</div>
                  </div>
                </template>
                <div class="ds-block" x-show="sources.references.length">
                  <h3>References <span class="ds-count" x-text="sources.references.length"></span></h3>
                  <ul class="ds-list">
                    <template x-for="reference in sources.references" :key="reference.key">
                      <li>
                        <span>
                          <span x-text="reference.lead"></span>
                          <template x-if="reference.url">
                            <a :href="reference.url" target="_blank" rel="noopener" x-text="reference.name"></a>
                          </template>
                          <span x-show="!reference.url" x-text="reference.name"></span>
                        </span>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>
            </template>

            <template x-if="section.id === 'about'">
              <dl class="ds-about">
                <template x-for="row in $store.dataset.page.about" :key="row.label">
                  <div>
                    <dt x-text="row.label"></dt>
                    <dd :class="{ code: row.code }">
                      <template x-for="(value, index) in row.values" :key="index">
                        <p>
                          <template x-if="value.url">
                            <a :href="value.url" target="_blank" rel="noopener" x-text="value.text"></a>
                          </template>
                          <span x-show="!value.url" x-text="value.text"></span>
                          <span class="ds-muted" x-text="value.note"></span>
                        </p>
                      </template>
                    </dd>
                  </div>
                </template>
              </dl>
            </template>

            <template x-if="section.id === 'related'">
              <ul class="ds-list">
                <template x-for="item in $store.dataset.related" :key="item.id">
                  <li>
                    <a
                      :href="'{{ site.baseurl }}/datasets/' + item.slug + '/'"
                      x-text="item.title"
                    ></a>
                    <span
                      class="ds-muted"
                      x-text="$store.dataset.relationLabel(item.relation)"
                    ></span>
                  </li>
                </template>
              </ul>
            </template>
          </section>
        </template>
      </main>
    </div>
  </template>
</div>
