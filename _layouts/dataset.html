---
layout: default
---

<div
  class="content-wrapper"
  x-data
  x-init="window.__sqlReady.then(db => $store.dataset.loadDataset(db, '{{ page.slug }}')).catch(err => console.error('Error loading database:', err))"
>
  <div class="modern-content">
    <template x-if="$store.dataset.dataset">
      <div data-component="view-switcher">
        <div
          class="dataset-detail-layout"
          data-component="dataset-display"
          data-hook="view"
          data-view="display"
          typeof="dcat:Dataset"
          :resource="$store.dataset.dataset.url"
        >
          <main class="main-content">
            <div class="dataset-header">
              <div
                :class="'category-badge ' + JSON.parse($store.dataset.dataset.risk_data_type)[0]"
              >
                <span class="badge-icon"></span>
                <p
                  x-text="JSON.parse($store.dataset.dataset.risk_data_type)[0]"
                ></p>
              </div>
              <h1 class="dataset-title">
                <span property="dct:title">{{ page.title }}</span>
              </h1>
              <div
                x-data="{ open: false }"
                x-bind:class="'dataset-description desc-truncate' + (open ? ' expanded' : '')"
                property="dct:description"
              >
                <p x-ref="description" class="desc-text">
                  {{ page.description }}
                </p>
                <button
                  x-show="$refs.description.scrollHeight > $refs.description.clientHeight"
                  class="desc-toggle"
                  @click="open = ! open"
                  x-text="open ? 'Show less' : 'Show more'"
                ></button>
              </div>

              <div class="quick-info">
                <div
                  class="info-card"
                  x-show="JSON.parse($store.dataset.dataset.creator).name"
                >
                  <div class="info-label">Organization</div>
                  <div
                    class="info-value"
                    x-text="JSON.parse($store.dataset.dataset.creator).name"
                  ></div>
                </div>
                <div class="info-card" x-show="$store.dataset.dataset.version">
                  <div class="info-label">Version</div>
                  <div
                    class="info-value"
                    x-text="$store.dataset.dataset.version"
                  ></div>
                </div>
                <div class="info-card">
                  <div class="info-label">License</div>
                  <div
                    class="info-value"
                    x-text="$store.dataset.dataset.license_title"
                  ></div>
                </div>
              </div>
            </div>

            <div class="content-section">
              <h2 class="section-title">Resources</h2>
              <ul class="resources-list">
                <template
                  x-for="resource in JSON.parse($store.dataset.dataset.resources)"
                  :key="resource.id"
                >
                  <li
                    class="resource-item"
                    data-hook="resource-item"
                    property="dcat:distribution"
                    typeof="dcat:Distribution"
                  >
                    <div class="resource-header">
                      <h3 class="resource-title">
                        <a
                          href="resource.download_url"
                          property="dcat:accessURL"
                        >
                          <i class="fa fa-download"></i>
                          <span property="dct:title" x-text="resource.title"></span>
                        </a>
                      </h3>
                      <span
                        x-show="resource.format"
                        class="format-badge"
                        property="dcat:mediaType"
                        x-text="resource.format"
                      ></span>
                      <span
                        x-show="!resource.format && resource.media_type"
                        class="format-badge"
                        property="dcat:mediaType"
                        x-text="resource.media_type"
                      ></span>
                    </div>
                    <p
                      x-show="resource.description"
                      class="resource-description"
                      x-text="resource.description"
                    ></p>
                  </li>
                </template>
              </ul>
            </div>
            <div class="content-section">
              <h2 class="section-title">Dataset Info</h2>
              <table class="data-table">
                <tr>
                  <th>ID of dataset</th>
                  <td x-text="$store.dataset.dataset.id"></td>
                </tr>
                <tr>
                  <th>Catalog</th>
                  <td x-text="$store.dataset.dataset.catalog_title"></td>
                </tr>
                <tr x-show="JSON.parse($store.dataset.dataset.publisher).name">
                  <th>Publisher of dataset</th>
                  <td x-show="JSON.parse($store.dataset.dataset.publisher).url">
                    <a
                      :href="JSON.parse($store.dataset.dataset.publisher).url"
                      x-text="JSON.parse($store.dataset.dataset.publisher).name"
                    ></a>
                  </td>
                  <td
                    x-show="!JSON.parse($store.dataset.dataset.publisher).url"
                    x-text="JSON.parse($store.dataset.dataset.publisher).name"
                  ></td>
                </tr>
                <tr x-show="$store.dataset.dataset.details">
                  <th>Additional details</th>
                  <td x-text="$store.dataset.dataset.details"></td>
                </tr>
                <tr x-show="JSON.parse($store.dataset.dataset.creator).name">
                  <th>Creator</th>
                  <td x-show="JSON.parse($store.dataset.dataset.creator).url">
                    <a
                      :href="JSON.parse($store.dataset.dataset.creator).url"
                      x-text="JSON.parse($store.dataset.dataset.creator).name"
                    ></a>
                  </td>
                  <td
                    x-show="!JSON.parse($store.dataset.dataset.creator).url"
                    x-text="JSON.parse($store.dataset.dataset.creator).name"
                  ></td>
                </tr>
                <tr
                  x-show="JSON.parse($store.dataset.dataset.contact_point).name"
                >
                  <th>Contact Point</th>
                  <td
                    x-show="JSON.parse($store.dataset.dataset.contact_point).url"
                  >
                    <a
                      :href="JSON.parse($store.dataset.dataset.contact_point).url"
                      x-text="JSON.parse($store.dataset.dataset.publisher).name"
                    ></a>
                  </td>
                  <td
                    x-show="!JSON.parse($store.dataset.dataset.contact_point).url"
                    x-text="JSON.parse($store.dataset.dataset.contact_point).name"
                  ></td>
                </tr>
                <tr>
                  <th>License</th>
                  <td>
                    <a
                      :href="$store.dataset.dataset.license_url"
                      x-text="$store.dataset.dataset.license_title"
                    ></a>
                  </td>
                </tr>
              </table>
            </div>
          </main>

          <aside class="sidebar">
            <div class="sidebar-card">
              <h4>Metadata</h4>
              <div style="display: flex; gap: 8px; margin-top: 12px">
                <a
                  href="https://raw.githubusercontent.com/GFDRR/rdl-jkan/rdl-1.0/_datasets/json/{{ page.id }}.json"
                  class="format-badge"
                  style="text-decoration: none"
                  property="dcat:accessURL"
                  download
                >
                  json
                </a>
              </div>
            </div>
            {% include display/spatial_extent_map.html %}
          </aside>
        </div>
      </div>
    </template>
  </div>
</div>
